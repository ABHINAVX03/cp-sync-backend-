# ── Application ──
spring.application.name=cpsync-backend
server.port=${PORT:8080}

# ── Database (Neon Postgres) ──
spring.datasource.url=${DB_HOST}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── HikariCP connection pool ──
# Neon free tier cap is 20 total connections across ALL clients.
# We keep max=5 so we never starve other connections (scheduler,
# request threads, health checks all share this pool).
# If you upgrade Neon to a paid plan, raise this to 10-15.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# Fail fast (20s) rather than queuing requests indefinitely —
# better to return a 503 than silently stall the thread pool.
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=120000
# Keeps connection alive through Neon's 5-minute idle timeout
spring.datasource.hikari.keepalive-time=60000

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Batch inserts: Hibernate will group up to 20 INSERT statements
# into one round-trip. Works with saveAll() in SyncService.
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Flyway ──
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Google OAuth2 ──
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile,https://www.googleapis.com/auth/calendar
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token

# ── JWT ──
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=604800000

# ── Token Encryption ──
app.encryption.key=${TOKEN_ENCRYPTION_KEY}

# ── Scheduler tuning ──
# 50 users per batch keeps peak RAM under ~200MB on Render's 512MB free tier.
# 500ms pause between batches lets Neon's connection pool recycle.
app.sync.batch-size=50
app.sync.batch-pause-ms=500
# Thread pool: 4 threads is plenty for free tier (0.1 CPU shared).
# More threads = more context switching, not more throughput on 0.1 CPU.
app.sync.thread-pool-size=4

# ── Google Calendar retry ──
app.calendar.max-retries=3
app.calendar.backoff-base-ms=1000

# ── Actuator ──
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# ── Production URLs ──
app.frontend.url=${FRONTEND_URL:https://cp-sync-frontend.vercel.app/auth/callback}
app.cors.allowed-origins=${CORS_ORIGINS:https://cp-sync-frontend.vercel.app,http://localhost:3000}

# ── Logging ──
logging.level.root=INFO
logging.level.com.cpsync=INFO

# ── Mail ──
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.admin-email=${ADMIN_EMAIL}

# ── SendGrid ──
sendgrid.api-key=${SENDGRID_API_KEY:}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:noreply@cpsync.dev}